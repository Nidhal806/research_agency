<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المقالات العلمية – الفهرس العراقي العلمي</title>

  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/research_agency/css/site.css" />
  <link rel="stylesheet" href="/assets/research_agency/css/articles_v2.css" />

  <link rel="icon" href="/assets/research_agency/images/iraqindex-logo.svg" type="image/svg+xml">
</head>
<body>

  <div id="site-header"></div>

  <section class="hero">
    <div class="container">
      <h1>المقالات العلمية</h1>
      <p style="margin:0;opacity:.9">
        استعراض وبحث في المقالات المفهرسة
      </p>
    </div>
  </section>

  <main class="container" style="padding:32px 0">

    <div class="articles-layout">

      <!-- Sidebar -->
       <aside class="filters-sidebar">

  <h3>تصفية النتائج</h3>

  <div class="filter-group">
    <h4>التخصص</h4>
    <div id="filter-subjects"></div>
  </div>

  <div class="filter-group">
    <h4>نوع المقال</h4>
    <div id="filter-doc-types"></div>
  </div>

  <div class="filter-group">
    <h4>السنة</h4>
    <div id="filter-years"></div>
  </div>

</aside>

      <!-- Content -->
      <div class="articles-content">

        <!-- البحث القديم كما هو -->
        <section class="search-panel" style="margin-bottom:32px">
          <div class="search-grid">

            <div class="form-group">
              <label>عنوان المقال</label>
              <input type="text" id="search-title" />
            </div>

            <div class="form-group">
              <label>اسم المؤلف</label>
              <input type="text" id="search-author" />
            </div>

            <div class="form-group form-group-action">
              <button id="search-btn" class="btn-primary">بحث</button>
            </div>

          </div>
        </section>

        <!-- النتائج -->
        <section id="articles-results"></section>

        <!-- pager -->
        <div id="pager" class="iqx-pager" style="margin-top:32px"></div>

    </div>

    </div>

  </main>

  <div id="site-footer"></div>

  <!-- نفس تحميل الهيدر والفوتر -->
  <script>
    fetch('/iraq_index/partials/iraqindex_header.html')
      .then(r => r.text())
      .then(t => document.getElementById('site-header').innerHTML = t);

    fetch('/iraq_index/partials/iraqindex_footer.html')
      .then(r => r.text())
      .then(t => document.getElementById('site-footer').innerHTML = t);
  </script>

  <!-- JS الجديد -->
  <script src="/assets/research_agency/js/journals-v2.js?v=2"></script>

</body>
</html>
