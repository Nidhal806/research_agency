<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تم إرسال الطلب – الفهرس العراقي العلمي</title>

  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/research_agency/css/site.css" />
  <link rel="stylesheet" href="/assets/research_agency/css/success.css" />
  <link rel="icon" href="/assets/research_agency/images/iraqindex-logo.svg" type="image/svg+xml">
</head>
<body>

  <!-- الهيدر -->
  <div id="site-header"></div>

  <!-- Hero -->
  <section class="hero iqx-succ-hero">
    <div class="container">
      <h1>تم إرسال الطلب بنجاح ✅</h1>
      <p>احتفظ برقم الطلب — ستحتاجه للدفع أو متابعة حالة الطلب لاحقا.</p>
    </div>
  </section>

  <!-- المحتوى -->
  <section class="container iqx-succ-container">
    <div id="alert" class="iqx-alert" hidden></div>

    <div class="iqx-succ-card">
      <div class="iqx-succ-head">
        <div>
          <span class="label">رقم الطلب</span>
          <div class="value" id="outId">—</div>
        </div>
        <span class="badge light" id="badgeHint">جارِ التحميل…</span>
      </div>

      <div class="iqx-divider"></div>

      <div class="iqx-succ-actions">
        <button id="btnCopyId">نسخ رقم الطلب</button>
        <button id="btnCopyTrack">نسخ رابط المتابعة</button>
      </div>

      <div class="iqx-succ-actions">
        <a id="btnPayNow" class="btn-primary" href="#">ادفع الآن</a>
        <a id="btnTrackNow" class="btn-secondary" href="#">متابعة الطلب</a>
      </div>
  </section>

  <!-- الفوتر -->
  <div id="site-footer"></div>

  <!-- حقن الهيدر/الفوتر -->
  <script>
    fetch('/iraq_index/partials/iraqindex_header.html?v=1')
      .then(r => r.text()).then(t => { document.getElementById('site-header').innerHTML = t; });

    fetch('/iraq_index/partials/iraqindex_footer.html?v=1')
      .then(r => r.text()).then(t => { document.getElementById('site-footer').innerHTML = t; });
  </script>

  <!-- JS -->
  <script src="/assets/research_agency/js/success.js"></script>
<script>
(function () {
  // نقرأ رقم الطلب العام من الرابط: ?application_id=IIX-....
  const qs = new URLSearchParams(location.search);
  const appId = (qs.get("application_id") || "").trim();

  // الأزرار الموجودة عندك
  const btnPay   = document.getElementById("btnPayNow");
  const btnTrack = document.getElementById("btnTrackNow");

  // رابط التتبع (مع أو بدون رقم)
  const trackUrl = appId
    ? `/iraq_index/track?application_id=${encodeURIComponent(appId)}`
    : `/iraq_index/track`;

  // نجعل الزرين يذهبان إلى التتبع
  if (btnPay)   btnPay.href = trackUrl;
  if (btnTrack) btnTrack.href = trackUrl;
})();
</script>


</body>
</html>
